# Regression suite on every push and pull request. MATLAB on GitHub runners is free only for
# public repositories, so the job is skipped while the repository is private.
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  run-tests:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v2
        with:
          command: RUN_TESTS; r = fileread('TEST_REPORT.txt'); assert(contains(r, ' 0 FAIL, 0 ERRORS'), 'regression suite failed')
