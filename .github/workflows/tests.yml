# Regression suite on every push and pull request (MATLAB is free for public repositories).
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v2
        with:
          command: RUN_TESTS; r = fileread('TEST_REPORT.txt'); assert(contains(r, ' 0 FAIL, 0 ERRORS'), 'regression suite failed')
